name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen ldid && xcodegen
      - run: |
          xcodebuild -project TipaGet.xcodeproj -scheme TipaGet -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/TipaGet.app Payload/
          ldid -Sentitlements.plist Payload/TipaGet.app/TipaGet
          zip -r TipaGet.tipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TipaGet
          path: TipaGet.tipa
          
